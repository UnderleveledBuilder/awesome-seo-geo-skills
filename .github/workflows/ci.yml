name: CI

# 2026-11-13 起只能手动触发：数据校验由维护者合并前在本地跑（python scripts/build.py --validate），这个文件留作参考。
on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 校验数据
        run: python scripts/build.py --validate
